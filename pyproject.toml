[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-breaker"
version = "0.1.0"
description = "A2A multi-agent system for surfacing, breaking down, and contextualizing AI research papers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Henry Wu" }]

dependencies = [
    # BeeAI — A2A framework. Alpha Python SDK; pinned minor to avoid surprise breaks.
    "beeai-framework>=0.1,<0.3",
    "agentstack-sdk>=0.1,<0.3",

    # LLM providers (BeeAI ChatModel routes through these)
    "anthropic>=0.40",

    # Persistence
    "supabase>=2.7,<3",
    "pgvector>=0.3",

    # Paper sources
    "arxiv>=2.1",
    "semanticscholar>=0.8",

    # PDF + embeddings
    "httpx>=0.27",
    "pypdf>=4.3",
    "sentence-transformers>=3.0",

    # Plumbing
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
paper-breaker = "paper_breaker.cli:app"
paper-breaker-server = "paper_breaker.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_breaker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
