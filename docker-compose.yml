# Local dev stack. `docker compose up agent` brings up the BeeAI A2A server.
# Supabase runs as a hosted service in this setup — swap in supabase/cli's
# local stack later if you want fully offline dev.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Inside the container uvicorn must listen on all interfaces, otherwise
      # the 8333:8333 port publish can't reach it. HOST in .env defaults to
      # 127.0.0.1 for local dev on the host — override it here.
      HOST: "0.0.0.0"
    ports:
      - "8333:8333"
    volumes:
      - ./src:/app/src:ro
    command: ["paper-breaker-server"]
